<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#9f1239"><title>ระบบสื่อสารด้วยใจ · ห้องยา</title><link rel="manifest" href="./manifest.json"><link rel="icon" href="assets/mascot.png" type="image/png">
<style>:root{--rose:#be185d;--dark:#881337;--cream:#fffaf5}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--cream);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif}.bar{height:64px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(120deg,var(--dark),var(--rose),#db2777);color:#fff;box-shadow:0 8px 24px rgba(136,19,55,.18);position:relative;z-index:5}.brand{display:flex;align-items:center;gap:11px;min-width:0;font-weight:800}.brand img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:50%;padding:3px}.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.links{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;text-decoration:none;font-size:13px;font-weight:800}.wrap{position:relative;height:calc(100dvh - 64px);background:linear-gradient(145deg,#fff7ed,#fff1f2 55%,#f0fdf4)}iframe{width:100%;height:100%;border:0;display:block;background:transparent}.loading{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#fff7ed,#fff1f2 55%,#f0fdf4);transition:opacity .35s,visibility .35s}.loading.done{opacity:0;visibility:hidden}.card{text-align:center;color:var(--dark)}.card img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 12px 16px rgba(190,24,93,.16));animation:float 1.8s ease-in-out infinite}.card strong{display:block;margin-top:9px;font-size:18px}.card small{display:block;color:#64748b;margin-top:5px}.retry{display:none;margin:14px auto 0;border:0;border-radius:999px;background:var(--rose);color:#fff;padding:10px 16px;font-weight:800}.loading.slow .retry{display:block}@keyframes float{50%{transform:translateY(-7px)}}@media(max-width:640px){.bar{height:56px;padding:0 10px}.brand img{width:36px;height:36px}.brand span{font-size:14px}.links{padding:8px 10px;font-size:12px}.wrap{height:calc(100dvh - 56px)}}</style></head><body>
<header class="bar"><div class="brand"><img src="assets/mascot.png" alt=""><span>ระบบสื่อสารด้วยใจ · ห้องยา</span></div><a class="links" href="links/">🔗 จัดการลิงก์วอร์ด</a></header>
<main class="wrap"><div id="loading" class="loading" role="status"><div class="card"><img src="assets/mascot.png" alt=""><strong>กำลังเปิดระบบสื่อสารด้วยใจ</strong><small>หน้าปัจจุบันจะไม่ถูกปิดระหว่างซิงก์ข้อมูล</small><button id="retry" class="retry">ลองเชื่อมต่ออีกครั้ง</button></div></div><iframe id="appFrame" title="ระบบสื่อสารด้วยใจ · ห้องยา" src="https://script.google.com/macros/s/AKfycbwi1Uj2CS4SKnzxBTNFgkHCmUQvYd8wkxKR5A25_H_6xAdS-F_hOoTIqDD_D8reTY1hLA/exec?view=pharmacy&embedded=1" allow="clipboard-write; camera" referrerpolicy="strict-origin-when-cross-origin"></iframe></main>
<script>const frame=document.getElementById('appFrame'),loading=document.getElementById('loading'),retry=document.getElementById('retry');let timer=setTimeout(()=>loading.classList.add('slow'),12000);frame.addEventListener('load',()=>{clearTimeout(timer);loading.classList.add('done')},{once:true});retry.onclick=()=>{loading.classList.remove('done','slow');frame.src=frame.src;timer=setTimeout(()=>loading.classList.add('slow'),12000)};if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
