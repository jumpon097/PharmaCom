<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#9f1239"><title>ศูนย์ลิงก์วอร์ด · ระบบสื่อสารด้วยใจ</title><link rel="manifest" href="./manifest.json"><link rel="icon" href="../assets/mascot.png"><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>:root{--rose:#be185d;--dark:#881337;--cream:#fffaf5}*{box-sizing:border-box}body{margin:0;color:#292524;background:radial-gradient(circle at 0 0,rgba(251,207,232,.6),transparent 34rem),radial-gradient(circle at 100% 100%,rgba(187,247,208,.5),transparent 30rem),var(--cream);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:26px 18px 54px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.identity{display:flex;align-items:center;gap:14px}.identity img{width:70px;height:70px;object-fit:contain}.title{margin:0;color:var(--dark);font-size:clamp(24px,4vw,36px)}.sub{margin:4px 0 0;color:#78716c}.back{padding:10px 15px;border:1px solid #fecdd3;border-radius:999px;background:#fff;color:var(--dark);font-weight:800;text-decoration:none;white-space:nowrap}.notice{display:flex;gap:12px;padding:15px 17px;border:1px solid #bbf7d0;background:#f0fdf4;border-radius:18px;color:#166534;margin-bottom:20px}.notice p{margin:3px 0 0;font-size:13px;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:15px}.ward{background:#fff;border:1px solid #ffe4e6;border-radius:24px;padding:18px;box-shadow:0 10px 28px rgba(136,19,55,.07)}.badge{display:inline-flex;padding:5px 10px;border-radius:999px;background:#fdf2f8;color:#9d174d;font-size:11px;font-weight:900}.ward h2{font-size:20px;margin:12px 0 3px;color:#4c0519}.id{font:11px ui-monospace,monospace;color:#a8a29e;margin-bottom:15px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:13px;padding:10px 9px;font:700 13px inherit;cursor:pointer;text-decoration:none;text-align:center}.open{background:var(--rose);color:#fff}.copy{background:#fff1f2;color:#9f1239;border:1px solid #fecdd3}.qr{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}.share{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:#292524;color:#fff;padding:11px 16px;border-radius:999px;font-size:13px;font-weight:700;transition:.25s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}dialog{border:0;border-radius:28px;padding:0;box-shadow:0 28px 80px rgba(76,5,25,.28);max-width:92vw}dialog::backdrop{background:rgba(41,37,36,.58);backdrop-filter:blur(5px)}.modal{width:360px;max-width:100%;padding:24px;text-align:center;background:#fffaf5}.modal h3{margin:0 0 4px;color:var(--dark)}.modal p{margin:0 0 17px;color:#78716c;font-size:13px}.qrbox{width:236px;height:236px;margin:auto;background:#fff;padding:12px;border-radius:20px;display:grid;place-items:center;border:1px solid #ffe4e6}.qrbox img,.qrbox canvas{max-width:100%;height:auto}.modal-actions{display:flex;gap:8px;margin-top:18px}.modal-actions button{flex:1}@media(max-width:600px){.wrap{padding:18px 12px 40px}.identity img{width:54px;height:54px}.back{font-size:12px}}</style></head><body><main class="wrap"><header class="top"><div class="identity"><img src="../assets/mascot.png" alt=""><div><h1 class="title">ศูนย์ลิงก์วอร์ด</h1><p class="sub">เปิด คัดลอก หรือสร้าง QR ส่งให้แต่ละหน่วยงาน</p></div></div><a class="back" href="../">← ห้องยา</a></header><section class="notice"><span>🌿</span><div><b>วอร์ดจะเข้าถึงเฉพาะหน้าของตนเอง</b><p>ลิงก์ที่แจกไม่มีเมนูกลับห้องยาและไม่มีทางลัดไปวอร์ดอื่น ส่วน QR เข้ากลุ่ม Telegram ตั้งค่าในเมนูตั้งค่าระบบ โดยวางลิงก์เชิญ https://t.me/... แยกรายวอร์ด</p></div></section><section id="grid" class="grid"></section></main><dialog id="qrDialog"><div class="modal"><h3 id="qrTitle"></h3><p>QR สำหรับเปิดหน้าวอร์ดโดยตรง</p><div id="qrBox" class="qrbox"></div><div class="modal-actions"><button class="btn qr" id="downloadQr">ดาวน์โหลด QR</button><button class="btn copy" onclick="qrDialog.close()">ปิด</button></div></div></dialog><div id="toast" class="toast"></div><script>const WARDS=[{"slug":"sarocha","name":"พิเศษ ชั้น 5","id":"1773350275265"},{"slug":"sattabongkot","name":"ศัลยกรรม ชั้น 4","id":"1773350292289"},{"slug":"busabong","name":"สามัญชาย ชั้น 5","id":"1773350308392"},{"slug":"busaban","name":"สามัญหญิง ชั้น 6","id":"1773360203772"},{"slug":"patama","name":"ปัทมา","id":"1773360217137"},{"slug":"pathumman","name":"ปทุมมาลย์","id":"1773360245622"},{"slug":"icu","name":"ICU","id":"1773360255920"},{"slug":"bmt","name":"BMT","id":"1773360269811"},{"slug":"opd-checkup-5","name":"ตรวจสุขภาพ ชั้น 5","id":"1780887310827"},{"slug":"ubch-premium-clinic","name":"UBCH Premium Clinic","id":"1790238588713"}],BASE='https://jumpon097.github.io/PharmaCom/wards/',grid=document.getElementById('grid'),toast=document.getElementById('toast'),qrDialog=document.getElementById('qrDialog'),qrBox=document.getElementById('qrBox'),qrTitle=document.getElementById('qrTitle'),downloadQr=document.getElementById('downloadQr');let active=null;const url=w=>BASE+w.slug+'/';WARDS.forEach(w=>{const el=document.createElement('article');el.className='ward';el.innerHTML='<span class="badge">หน้าวอร์ดเฉพาะหน่วยงาน</span><h2>'+w.name+'</h2><div class="id">WARD ID '+w.id+'</div><div class="actions"><a class="btn open" target="_blank" rel="noopener" href="'+url(w)+'">เปิดหน้า</a><button class="btn copy">คัดลอกลิงก์</button><button class="btn qr">QR วอร์ด</button><button class="btn share">ส่งต่อ</button></div>';el.querySelector('.copy').onclick=()=>copy(w);el.querySelector('.qr').onclick=()=>show(w);el.querySelector('.share').onclick=()=>share(w);grid.appendChild(el)});function flash(m){toast.textContent=m;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}async function copy(w){await navigator.clipboard.writeText(url(w));flash('คัดลอกลิงก์ '+w.name+' แล้ว')}async function share(w){if(navigator.share)await navigator.share({title:w.name+' · ระบบสื่อสารด้วยใจ',url:url(w)}).catch(()=>{});else copy(w)}function show(w){active=w;qrTitle.textContent=w.name;qrBox.innerHTML='';new QRCode(qrBox,{text:url(w),width:212,height:212,colorDark:'#4c0519',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.H});qrDialog.showModal()}downloadQr.onclick=()=>{const canvas=qrBox.querySelector('canvas'),img=qrBox.querySelector('img'),a=document.createElement('a');a.download='PharmaCom-'+active.slug+'-QR.png';a.href=canvas?canvas.toDataURL('image/png'):img.src;a.click()};if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
