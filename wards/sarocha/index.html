<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#9f1239"><title>พิเศษ ชั้น 5 · ระบบสื่อสารด้วยใจ</title><link rel="manifest" href="./manifest.json"><link rel="icon" href="../../assets/mascot.png" type="image/png"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fffaf5;font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif}.shell{position:relative;width:100%;height:100dvh;background:linear-gradient(145deg,#fff7ed,#fff1f2 55%,#f0fdf4)}iframe{width:100%;height:100%;border:0;display:block;background:transparent}.loading{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#fff7ed,#fff1f2 55%,#f0fdf4);transition:opacity .35s,visibility .35s}.loading.done{opacity:0;visibility:hidden}.loading.slow .retry{display:inline-flex}.card{text-align:center;color:#881337;padding:24px}.card img{width:112px;height:112px;object-fit:contain;filter:drop-shadow(0 12px 16px rgba(190,24,93,.16));animation:float 1.8s ease-in-out infinite}.card strong{display:block;font-size:19px;margin-top:10px}.card small{display:block;color:#64748b;margin-top:5px}.retry{display:none;border:0;border-radius:999px;background:#be185d;color:#fff;padding:10px 16px;font-weight:800;margin-top:15px}@keyframes float{50%{transform:translateY(-7px)}}</style></head><body><main class="shell"><div id="loading" class="loading" role="status"><div class="card"><img src="../../assets/mascot.png" alt=""><strong>กำลังเปิดหน้า พิเศษ ชั้น 5</strong><small>ลิงก์นี้เปิดได้เฉพาะวอร์ดที่กำหนด</small><button id="retry" class="retry">ลองอีกครั้ง</button></div></div><iframe id="wardFrame" title="พิเศษ ชั้น 5" allow="clipboard-write; camera" referrerpolicy="strict-origin-when-cross-origin"></iframe></main><script>const GAS_BASE="https://script.google.com/macros/s/AKfycbwi1Uj2CS4SKnzxBTNFgkHCmUQvYd8wkxKR5A25_H_6xAdS-F_hOoTIqDD_D8reTY1hLA/exec",WARD_ID="1773350275265",incoming=new URLSearchParams(location.search),allowed=['tab','roomId','topic','topicCode','replyToken','refMessageId'],outgoing=new URLSearchParams({view:'ward',id:WARD_ID,lockedWard:'1',embedded:'1'});allowed.forEach(key=>{const value=incoming.get(key);if(value)outgoing.set(key,value)});const frame=document.getElementById('wardFrame'),loading=document.getElementById('loading'),retry=document.getElementById('retry');frame.src=GAS_BASE+'?'+outgoing;let timer=setTimeout(()=>loading.classList.add('slow'),12000);frame.addEventListener('load',()=>{clearTimeout(timer);loading.classList.add('done')},{once:true});retry.onclick=()=>{loading.classList.remove('done','slow');frame.src=GAS_BASE+'?'+outgoing+'&retry='+Date.now();timer=setTimeout(()=>loading.classList.add('slow'),12000)};if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
